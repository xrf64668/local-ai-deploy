name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Setup Python 3.11 for local HTTP Worker tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify LTX HTTP task lifecycle without downloading weights
        run: python -m unittest discover -s examples/ltx_http/tests -v
      - name: Setup Java 17 for client compile check
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java HTTP client
        run: |
          mkdir -p "$RUNNER_TEMP/ltx-java"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/ltx-java" examples/ltx_http/LtxApiClient.java
      - name: Build VitePress
        run: npm run docs:build
      - name: Verify interactive model selector in Chrome
        run: node scripts/smoke-model-advisor.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
